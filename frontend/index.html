<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Findora — an AI-powered recovery platform to report lost items, browse found belongings, submit claims, and search with AI. Reunite people with what matters."
    />
    <meta property="og:title" content="Findora" />
    <meta
      property="og:description"
      content="Report lost and found items, discover intelligent matches, verify ownership privately and coordinate safe handovers."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("findora-theme");
          document.documentElement.dataset.theme =
            theme === "light" || theme === "dark" ? theme : "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>Findora — Every Lost Belonging Has a Story</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
